{% extends 'admin/adminindex.html' %}

{% block body %}

<div class="container py-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
          {% for category, message in messages %}
              <div class="alert alert-{{ category }}" role="alert">
                  {{ message }}
              </div>
          {% endfor %}
      {% endif %}
  {% endwith %}
  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-header bg-gradient bg-primary text-white py-3">
      <h4 class="mb-0"><i class="fas fa-calendar-plus me-2"></i> Add Timetable</h4>
    </div>

    <div class="card-body p-4">
      <form action="/addtimetable" method="post" class="row g-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="col-md-6">
          <label class="form-label fw-semibold">Course</label>
          <select id="courseSelect" class="form-select form-select-lg rounded-3" onchange="filterDepartments()">
            <option value="">-- Select Course --</option>
            {% for c in course_list %}
            <option value="{{ c.course_id }}">{{ c.course_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Department</label>
          <select class="form-select form-select-lg rounded-3" id="department" name="select" required>
            <option value="">-- Select Department --</option>
            {% for d in dept_list %}
            <option value="{{ d.department_name }}" data-course="{{ d.course_id }}">
                {{ d.department_name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Semester</label>
          <select class="form-select form-select-lg rounded-3" name="Semester" required>
            <option disabled selected>-- Select Semester --</option>
            {% for s in range(1, 9) %}
            <option>{{ s }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Division</label>
          <select class="form-select form-select-lg rounded-3" name="division" required>
            <option disabled selected>-- Select Division --</option>
            <option>A</option><option>B</option><option>C</option>
          </select>
        </div>

        <div class="col-12 text-end">
          <button type="submit" class="btn btn-success btn-lg px-4 rounded-3 shadow-sm">
            Add Timetable
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
function filterDepartments() {
    var courseId = document.getElementById("courseSelect").value;
    var deptSelect = document.getElementById("department");
    var options = deptSelect.getElementsByTagName("option");

    deptSelect.value = ""; 

    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        var deptCourse = option.getAttribute("data-course");
        if (courseId === "" || deptCourse === courseId || option.value === "") {
            option.style.display = "block"; 
        } else {
            option.style.display = "none"; 
        }
    }
}
</script>
{% endblock %}
