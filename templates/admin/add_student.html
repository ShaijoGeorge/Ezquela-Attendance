{% extends 'admin/base.html' %}
{% block body %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-user-plus me-2"></i>Register New Student</h5>
        </div>
        <div class="card-body">
            <form action="/admin_save_student" method="post" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <h6 class="text-primary mb-3">Academic Details</h6>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Department</label>
                        <select name="select" class="form-select" required>
                            <option value="">-- Select Department --</option>
                            {% for d in dept %}
                            <option value="{{ d.department_name }}">{{ d.department_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Semester</label>
                        <select name="select1" class="form-select" required>
                            <option value="">-- Select --</option>
                            <option value="1">1</option><option value="2">2</option>
                            <option value="3">3</option><option value="4">4</option>
                            <option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Division</label>
                        <select name="select3" class="form-select" required>
                            <option value="A">A</option>
                            <option value="B">B</option>
                        </select>
                    </div>
                </div>

                <h6 class="text-primary mb-3 mt-4">Personal Details</h6>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="text1" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Register Number</label>
                        <input type="text" name="text2" class="form-control" required>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="text6" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Gender</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Male" required> Male
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Female" required> Female
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="number" name="text4" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="text5" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea name="text3" class="form-control" rows="2" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Upload Photo</label>
                    <input type="file" name="files" class="form-control" accept="image/*" required>
                </div>

                <h6 class="text-primary mb-3 mt-4">Guardian Info</h6>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Guardian Name</label>
                        <input type="text" name="guardian" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Guardian Phone</label>
                        <input type="number" name="phone" class="form-control" required>
                    </div>
                </div>

                <h6 class="text-danger mb-3 mt-4">Login Credentials</h6>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" name="uname" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Add Student</button>
                    <a href="/view_student" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
