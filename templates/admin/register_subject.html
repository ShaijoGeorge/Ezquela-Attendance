{% extends 'admin/adminindex.html' %}

{% block body %}

  <div class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="fas fa-plus-circle me-2"></i> Add New Subject</h5>
      </div>

      <div class="card-body">
        <form method="post" action="/register_subject" class="row g-3">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="col-md-6">
            <label class="form-label">Course</label>
            <select id="courseSelect" class="form-select" onchange="filterDepartments()">
              <option value="">-- Select Course --</option>
              {% for c in course_list %}
              <option value="{{ c.course_id }}">{{ c.course_name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label for="select" class="form-label">Department</label>
            <select name="department" id="select" class="form-select" required>
              <option value="">-- Select Department --</option>
              {% for d in dept_list %}
              <option value="{{ d.department_name }}" data-course="{{ d.course_id }}">
                {{ d.department_name }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Semester</label>
            <select name="Semester" class="form-select" required>
              <option disabled selected>-- Semester --</option>
              {% for s in range(1,9) %}
              <option>{{ s }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Subject Code</label>
            <input type="text" name="text1" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Subject Name</label>
            <input type="text" name="text2" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Staff</label>
            <select name="Staff" id="select2" class="form-select" disabled required>
              <option>-- Select Staff --</option>
            </select>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-success w-100">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script>
    // CASCADING DROPDOWN LOGIC
    function filterDepartments() {
        var courseId = document.getElementById("courseSelect").value;
        var deptSelect = document.getElementById("select");
        var options = deptSelect.getElementsByTagName("option");

        deptSelect.value = ""; // Reset department selection
        $('select#select2').html('<option>-- Select Staff --</option>').prop('disabled', true); // Reset Staff too

        for (var i = 0; i < options.length; i++) {
            var option = options[i];
            var deptCourse = option.getAttribute("data-course");

            if (courseId === "" || deptCourse === courseId || option.value === "") {
                option.style.display = "block"; 
            } else {
                option.style.display = "none"; 
            }
        }
    }

    $(document).ready(function(){
      $("select#select").change(function() {
        var dept = $('#select option:selected').val();
        if (dept) {
          $.ajax({
            type: 'POST',
            url: "/get_staff",
            data: { dept: dept, csrf_token: $("input[name='csrf_token']").val() },
            success: function(response) {
              var opt = '<option>-- Select Staff --</option>';
              for (var i = 0; i < response.length; i ++) {
                opt += '<option value="' + response[i].id + '">' + response[i].name + '</option>';
              }
              $('select#select2').html(opt).prop('disabled', false);
            }
          });
        }
      });
    });
  </script>

{% endblock %}
