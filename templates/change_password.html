{% extends base %}
{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-lock me-2"></i>Change Password</h5>
                </div>
                <div class="card-body p-4">
                    
                    <form action="/change_password" method="post" onsubmit="return confirm('Are you sure you want to update your password?');">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Current Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" name="current_password" id="curr_pass" class="form-control" required placeholder="Enter current password">
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePass('curr_pass', 'icon_curr')">
                                    <i class="fas fa-eye" id="icon_curr"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" name="new_password" id="new_pass" class="form-control" required placeholder="Enter new password">
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePass('new_pass', 'icon_new')">
                                    <i class="fas fa-eye" id="icon_new"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Confirm New Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" name="confirm_password" id="conf_pass" class="form-control" required placeholder="Re-enter new password">
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePass('conf_pass', 'icon_conf')">
                                    <i class="fas fa-eye" id="icon_conf"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">Update Password</button>
                            <a href="javascript:history.back()" class="btn btn-light border">Cancel</a>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePass(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
</script>
{% endblock %}
