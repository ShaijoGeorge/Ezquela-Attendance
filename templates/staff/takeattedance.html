{% extends 'staff/base.html' %}
{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="fas fa-camera me-2"></i>Start Attendance</h4>
                </div>
                <div class="card-body p-4">
                    <form action="/take_attendance" method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Select Class & Subject</label>
                            <select name="subject" class="form-select form-select-lg" required>
                                <option value="" disabled selected>-- Select Your Class --</option>
                                {% for sub in subjects %}
                                <option value="{{ sub.sid }}">
                                    {{ sub.course_name }} {{ sub.department_name }} (S{{ sub.semester }}) - {{ sub.subject }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Division</label>
                            <select name="division" class="form-select" required>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Hour</label>
                            <select name="hour" class="form-select" required>
                                {% for i in range(1, 8) %}
                                <option value="{{ i }}">Hour {{ i }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-video me-2"></i> Launch Camera
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
