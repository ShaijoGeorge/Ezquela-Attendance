{% extends 'staff/base.html' %}
{% block body %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-primary">My Profile</h5>
            <a href="/staff_edit_profile" class="btn btn-outline-primary btn-sm">
                <i class="fas fa-pen me-2"></i>Edit Details
            </a>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-4 text-center border-end">
                    <img src="/static/photos/staffphoto/{{ i.photo }}" class="img-fluid rounded-circle mb-3 shadow-sm" style="width: 180px; height: 180px; object-fit: cover;">
                    <h3 class="text-dark">{{ i.name }}</h3>
                    <p class="text-muted">{{ i.qualification }}</p>
                    <span class="badge bg-info text-dark mb-3">{{ i.department_name }}</span>
                </div>
                
                <div class="col-md-8 px-4">
                    <h5 class="text-secondary border-bottom pb-2 mb-3">Contact Information</h5>
                    
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Email</div>
                        <div class="col-sm-8 fw-bold">{{ i.email }}</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Phone</div>
                        <div class="col-sm-8 fw-bold">{{ i.phone }}</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Gender</div>
                        <div class="col-sm-8 fw-bold">{{ i.gender }}</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Address</div>
                        <div class="col-sm-8 fw-bold">{{ i.address }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
