{% extends 'student/base.html' %}
{% block body %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-warning text-white">
            <h5 class="mb-0"><i class="fas fa-camera"></i> Train Your Face Model</h5>
        </div>
        <div class="card-body">
            <div class="alert alert-info">
                <strong>Instructions:</strong>
                <ul>
                    <li>Upload 10-20 photos of your face.</li>
                    <li>Ensure your face is clearly visible.</li>
                    <li>Try different angles and lighting conditions.</li>
                </ul>
            </div>

            <form action="/dataset_capture" method="post" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="mb-4">
                    <label class="form-label">Select Photos</label>
                    <input type="file" name="files" class="form-control" multiple required accept="image/*">
                    <small class="text-muted">You can select multiple files at once.</small>
                </div>
                
                <button type="submit" class="btn btn-warning text-white">
                    <i class="fas fa-cloud-upload-alt"></i> Upload & Train AI
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
