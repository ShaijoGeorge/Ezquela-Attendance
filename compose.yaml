services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=ezquela-db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=attendance_face
    depends_on:
      database:
        condition: service_healthy  # Waits for DB to be ready
    volumes:
      - .:/app

  database:
    image: mysql:8.0
    container_name: ezquela-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: attendance_face
    ports:
      - "3307:3306" # Using 3307 to avoid conflict with your other projects (3306/3308/3309)
    volumes:
      - db_data:/var/lib/mysql
      # Updated path to match 'attendance_face.dump' file
      - ./attendance_face.dump:/docker-entrypoint-initdb.d/init.sql
    healthcheck:  # The check itself
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

volumes:
  db_data: